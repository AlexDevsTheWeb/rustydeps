name: Docker

# Build the multi-arch RustyDeps container image and, for branch/tag pushes,
# publish it to GitHub Container Registry (ghcr.io).
#
#   * `main` pushes  -> publish, tagging `latest` (plus the branch name).
#   * `v*` tag pushes -> publish, tagging the release versions (`1.2.3`, `1.2`).
#   * pull requests   -> build both architectures but push nothing, then run
#                        the image locally as a smoke test, so a broken
#                        Dockerfile fails review instead of the registry.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: build image
    runs-on: ubuntu-latest
    # Cross-arch builds go through QEMU, so the dependency compile is slow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects mixed-case repository names and this owner is
      # `AlexDevsTheWeb`, so the reference is lowercased explicitly instead of
      # relying on `github.repository_owner` staying lowercase. `tr` rather than
      # bash's `${var,,}` keeps the step valid under any shell.
      - name: Compute image reference
        id: image
        run: |
          set -euo pipefail
          owner_and_repo="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${REGISTRY}/${owner_and_repo}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # `load` and `push` are mutually exclusive: a multi-platform image
          # cannot be loaded into the local daemon, and a pull request has
          # nowhere to push to.
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image is only useful if it runs. `--offline` keeps the check
      # deterministic while still exercising the entrypoint, the manifest
      # scanner and report rendering; the report goes to /tmp so the checkout
      # stays clean.
      - name: Smoke-test the image
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          image="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"
          echo "testing ${image}"
          docker run --rm "${image}" --version
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "${image}" \
            scan /workspace --offline --no-open -o /tmp/rustydeps-report.html
