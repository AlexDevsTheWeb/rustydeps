name: Release

# Build and publish RustyDeps binaries whenever a version tag (v*) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          name="rustydeps-${GITHUB_REF_NAME}-${{ matrix.target }}"
          stage="dist/${name}"
          mkdir -p "${stage}"
          cp "target/${{ matrix.target }}/release/rustydeps" "${stage}/"
          cp README.md "${stage}/" 2>/dev/null || true
          cp LICENSE-MIT LICENSE-APACHE "${stage}/" 2>/dev/null || true
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## RustyDeps ${GITHUB_REF_NAME}"
            echo
            echo "Prebuilt binaries for Linux (x86_64) and macOS (Intel and Apple Silicon)."
            echo
            echo "### Changelog"
            prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [ -n "${prev_tag}" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "${prev_tag}..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty=format:'- %s (%h)' -30
            fi
            echo
            echo
            echo "### Assets"
            for archive in dist/*.tar.gz; do
              echo "- $(basename "${archive}")"
            done
            echo
            echo "### Install"
            echo "    tar -xzf rustydeps-${GITHUB_REF_NAME}-<target>.tar.gz"
            echo "    ./rustydeps scan ."
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RustyDeps ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
